<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta charset="utf-8" />
  <title>Register</title>
  <link rel="stylesheet" href="/css/globals.css">
  <link rel="stylesheet" href="/css/styleguide.css">
  
  <style>
    /* Hide browser-native password reveal toggle (eye icon) for Edge/IE */
input[type="password"]::-ms-reveal,
input[type="password"]::-ms-clear {
  display: none;
  width: 0;
  height: 0;
}

/* Hide Webkit-based browser auto-fill icons for Chrome/Safari */
input::-webkit-credentials-auto-fill-button,
input::-webkit-contacts-auto-fill-button {
  visibility: hidden;
  display: none !important;
  pointer-events: none;
}
    /* 1. Global box model and base settings */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: #ffffff;
      font-family: var(--body-default-font-family, sans-serif);
      color: var(--color-neutral-n800, #333);
    }

    /* 2. Page container - flex column layout */
    .sign-in {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 32px;
    }

    /* 3. Header navigation */
    .header-variant {
      display: flex;
      align-items: center;
      margin-bottom: 24px;
      padding-top: env(safe-area-inset-top, 80px);
    }

    .action-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background-color: var(--color-neutral-n100, #f5f5f5);
      border-radius: 50%;
      text-decoration: none;
      margin-top: 44px;
    }

    .page-title {
      font-family: var(--title-screen-font-family);
      font-size: var(--title-screen-font-size, 24px);
      text-align: center;
      margin: 44px 0 32px 0;
    }

    /* 4. Form layout utilities */
    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    /* Form field group (label + input) */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Label styling */
    .form-label {
      font-size: var(--body-default-font-size, 14px);
      font-weight: var(--body-default-font-weight, 500);
    }

    /* Input wrapper */
    .input-wrapper {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background-color: var(--color-shade-white, #fff);
      border-radius: 8px;
      border: 1.5px solid var(--color-neutral-n200, #e0e0e0);
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--variable-collection-apple-blue, #007aff);
    }

    /* Input field base styles */
    .form-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: var(--body-default-font-size, 14px);
      color: inherit;
      width: 100%;
    }

    .form-input::placeholder {
      color: var(--color-neutral-n400, #9e9e9e);
    }

    /* Hide number input spinners */
    .form-input[type="number"]::-webkit-inner-spin-button,
    .form-input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* Password visibility toggle button */
    .toggle-password {
      background: none;
      border: none;
      padding: 0;
      margin-left: 8px;
      cursor: pointer;
      display: flex;
    }

    .hint-text {
      font-size: 12px;
      color: var(--color-neutral-n500, #757575);
      margin-top: 4px;
    }

    /* 5. Submit button */
    .submit-button {
      background-color: var(--variable-collection-apple-blue, #007aff);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: auto;
      width: 100%;
    }
  </style>
</head>
<body>

<main class="sign-in">
  
  <!-- Header back navigation -->
  <header class="header-variant" aria-label="Navigation header">
    <a th:href="@{/}" class="action-icon" aria-label="Go back">
      <img src="/img/fi-arrow-left.svg" alt="Back arrow" width="20" height="20" />
    </a>
  </header>

  <!-- Page title -->
  <h1 class="page-title">Login</h1>

  <!-- Login form -->
  <form th:action="@{/signin}" method="post" novalidate>


   <!-- Email -->
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <div class="input-wrapper">
        <input class="form-input" id="email" type="text" name="email" placeholder="cpt208" autocomplete="email" required />
      </div>
    </div>
    <!-- Password -->
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <div class="input-wrapper">
        <input class="form-input" id="password" type="password" name="password" placeholder="cpt208" minlength="6" autocomplete="current-password" aria-describedby="password-hint" />
        <button type="button" class="toggle-password" aria-label="Toggle password visibility" data-target="password">
          <img src="/img/fi-eye-off.svg" alt="Hide password" width="20" height="20" />
        </button>
      </div>
      <span class="hint-text" id="password-hint">must contain at least 6 characters</span>
    </div>

    <!-- Error message display -->
  <div th:if="${error}" style="color: #ff3b30; margin-bottom: 16px; text-align: center; font-size: 14px;">
    <p th:text="${error}"></p>
  </div>

    <!-- Submit button -->
    <button class="submit-button" type="submit">
      Login
    </button>

    <p style="text-align:center; margin-top:8px; font-size:14px; color:#666;">
      Don't have an account? <a th:href="@{/signup}" style="color:#007aff; text-decoration:none;">Sign up</a>
    </p>
  </form>

</main>

</body>
</html>
